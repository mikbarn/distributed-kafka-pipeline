apiVersion: v1
kind: Service
metadata:
  name: kafka-svc
  labels:
    app: kafka-app
  namespace: kafka
spec:
  #type: NodePort
  clusterIP: None
  ports:
    - name: '9092'
      port: 9092
      protocol: TCP
      targetPort: 9092
    - name: '9093'
      port: 9093
      protocol: TCP
      targetPort: 9093
    - name: '5000'
      port: 5000
      protocol: TCP
      targetPort: 5000
  selector:
    app: kafka-app

---

apiVersion: v1
kind: Service
metadata:
  name: kafka-svc-np
  labels:
    app: kafka-app
  namespace: kafka
spec:
  type: NodePort
  #clusterIP: None
  ports:
    - name: 'a'
      port: 30000
      protocol: TCP
      targetPort: 30000
      nodePort: 30000
    - name: 'b'
      port: 30001
      protocol: TCP
      targetPort: 30001
      nodePort: 30001
    - name: 'c'
      port: 30002
      protocol: TCP
      targetPort: 30002
      nodePort: 30002
    - name: 'd'
      port: 30003
      protocol: TCP
      targetPort: 30003
      nodePort: 30003
  selector:
    app: kafka-app-nginx

