apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: bbb
  labels:
    app: bb-app
  namespace: kafka
spec:
  serviceName: bb-svc
  replicas: 2
  selector:
    matchLabels:
      app: bb-app
  template:
    metadata:
      labels:
        app: bb-app
    spec:
      containers:
        - name: bb-container
          image: busybox:stable
          imagePullPolicy: IfNotPresent
          command: ["tail", "-f", "/dev/null"]
          ports:
            - containerPort: 9092
            - containerPort: 9093
            - containerPort: 5000
          env:
            - name: REPLICAS
              value: '1'
          volumeMounts:
            - name: data
              mountPath: /mnt/kafka
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - "ReadWriteOnce"
        resources:
          requests:
            storage: "1Gi"

