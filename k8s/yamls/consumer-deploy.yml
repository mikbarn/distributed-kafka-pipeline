apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-scala-consumer
  namespace: kafka
  labels:
    app:  kafka-scala-consumer
spec:
  replicas: 2
  selector:
    matchLabels:
      app: kafka-scala-consumer
  template:
    metadata:
      labels:
        app: kafka-scala-consumer
    spec:
      containers:
      - name: kafka-scala-consumer
        image: my_cons:1
        imagePullPolicy: IfNotPresent
        ports:
          - containerPort: 9092
          - containerPort: 5000
        env:
          - name: BOOTSTRAP_SERVER
            value: '192.168.49.2:30000'